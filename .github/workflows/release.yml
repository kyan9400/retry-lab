name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up pnpm
        uses: pnpm/action-setup@v6

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify release
        run: pnpm lint && pnpm test && pnpm build:pages

      - name: Package artifacts
        run: |
          tar -czf "retry-lab-site-${GITHUB_REF_NAME}.tar.gz" -C dist .
          git archive --format=tar.gz --output "retry-lab-source-${GITHUB_REF_NAME}.tar.gz" HEAD

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" retry-lab-*.tar.gz --verify-tag --generate-notes --title "Retry Lab $GITHUB_REF_NAME"
